<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-ESRGAN AI Image Upscaler</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ONNX Runtime Web -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-indigo-950 to-purple-950 min-h-screen text-white flex flex-col items-center justify-center p-4">

    <div class="glass max-w-xl w-full rounded-3xl p-8 shadow-2xl">
        <h1 class="text-3xl font-extrabold text-center mb-2 bg-gradient-to-r from-cyan-400 to-pink-400 bg-clip-text text-transparent">Real-ESRGAN AI Upscaler</h1>
        <p class="text-center text-gray-300 text-xs mb-6">রিয়েল-টাইম নিউরাল নেটওয়ার্ক দিয়ে ছবির শার্পনেস ও ডিটেইলস ৪ গুণ বৃদ্ধি করুন।</p>

        <!-- Drag & Drop Zone -->
        <div id="drop-zone" class="border-2 border-dashed border-cyan-400/40 rounded-2xl p-6 text-center cursor-pointer hover:border-pink-400 transition bg-white/5 mb-6 group">
            <input type="file" id="file-input" accept="image/*" class="hidden">
            <div id="drop-content" class="flex flex-col items-center">
                <svg class="mx-auto h-12 w-12 text-cyan-300 group-hover:text-pink-400 transition mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                </svg>
                <p class="text-sm font-medium text-gray-200">ছবি ড্র্যাগ করুন অথবা ক্লিক করে সিলেক্ট করুন</p>
                <p class="text-xs text-gray-400 mt-1">PNG, JPG, WEBP</p>
            </div>
            <div id="preview-container" class="hidden flex flex-col items-center">
                <img id="image-preview" class="max-h-40 rounded-xl shadow-md mb-2 object-contain" alt="Preview">
                <span id="file-name" class="text-xs text-cyan-300"></span>
            </div>
        </div>

        <!-- Status & Progress -->
        <div id="status-box" class="hidden mb-6 text-center bg-black/20 p-4 rounded-xl">
            <div class="inline-block animate-spin rounded-full h-6 border-2 border-pink-400 border-t-transparent w-6 mb-2"></div>
            <p id="status-text" class="text-xs text-pink-300 font-medium">রিয়েল-ইএসআরজিএএন মডেল লোড হচ্ছে...</p>
        </div>

        <!-- Action Button -->
        <button id="enhance-btn" disabled class="w-full py-3.5 px-4 bg-gradient-to-r from-cyan-500 to-pink-500 text-white font-bold rounded-2xl shadow-lg opacity-40 cursor-not-allowed hover:opacity-95 transition">
            Real-ESRGAN দিয়ে শার্প করুন
        </button>

        <!-- Result Section -->
        <div id="result-section" class="hidden mt-6 pt-6 border-t border-white/10 flex flex-col items-center">
            <h2 class="text-sm font-semibold text-cyan-300 mb-3">এহ্যান্স করা ফাইনাল ছবি (4x):</h2>
            <img id="result-image" class="max-h-56 rounded-xl shadow-2xl mb-4 border border-white/20 object-contain" alt="Enhanced Result">
            <a id="download-btn" download="real-esrgan-enhanced.png" class="py-2.5 px-6 bg-pink-600 hover:bg-pink-500 text-white text-sm font-bold rounded-xl shadow-md transition flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                ছবি ডাউনলোড করুন
            </a>
        </div>
    </div>

    <script>
        /* =========================================================
           আপনার দেওয়া HIGH QUALITY 385×512 PROCESSOR
           (কোনো পরিবর্তন ছাড়াই হুবহু বসানো হয়েছে)
           ========================================================= */
        const TARGET_W = 385;
        const TARGET_H = 512;

        async function processTo385x512(sourceCanvas) {
            let current = sourceCanvas;
            let currentW = current.width;
            let currentH = current.height;

            /* STEP 1: Progressive high-quality downscaling */
            while ( currentW > TARGET_W * 2 || currentH > TARGET_H * 2 ) {
                const scale = Math.min(
                    (TARGET_W * 2) / currentW,
                    (TARGET_H * 2) / currentH
                );
                const nextW = Math.max( TARGET_W, Math.round(currentW * scale) );
                const nextH = Math.max( TARGET_H, Math.round(currentH * scale) );

                const next = document.createElement("canvas");
                next.width = nextW;
                next.height = nextH;
                const ctx = next.getContext("2d", { alpha: false });
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = "high";
                ctx.drawImage( current, 0, 0, currentW, currentH, 0, 0, nextW, nextH );

                current = next;
                currentW = nextW;
                currentH = nextH;

                await new Promise( resolve => requestAnimationFrame(resolve) );
            }

            /* STEP 2: Exact 385×512 canvas, aspect ratio preserved */
            const output = document.createElement("canvas");
            output.width = TARGET_W;
            output.height = TARGET_H;
            const ctx = output.getContext("2d", { alpha: false });

            ctx.fillStyle = "#000000";
            ctx.fillRect( 0, 0, TARGET_W, TARGET_H );

            const scale = Math.min( TARGET_W / currentW, TARGET_H / currentH );
            const drawW = Math.round(currentW * scale);
            const drawH = Math.round(currentH * scale);
            const offsetX = Math.round( (TARGET_W - drawW) / 2 );
            const offsetY = Math.round( (TARGET_H - drawH) / 2 );

            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = "high";
            ctx.drawImage( current, 0, 0, currentW, currentH, offsetX, offsetY, drawW, drawH );

            /* STEP 3: Subtle sharpening */
            sharpen385(output);

            return output;
        }

        function sharpen385(canvas) {
            const ctx = canvas.getContext("2d", { willReadFrequently: true });
            const image = ctx.getImageData( 0, 0, canvas.width, canvas.height );
            const data = image.data;
            const original = new Uint8ClampedArray(data);
            const w = canvas.width;
            const h = canvas.height;

            const strength = 0.15;

            for ( let y = 1; y < h - 1; y++ ) {
                for ( let x = 1; x < w - 1; x++ ) {
                    const i = (y * w + x) * 4;
                    for ( let c = 0; c < 3; c++ ) {
                        const center = original[i + c];
                        const top = original[ i - w * 4 + c ];
                        const bottom = original[ i + w * 4 + c ];
                        const left = original[ i - 4 + c ];
                        const right = original[ i + 4 + c ];
                        const average = ( top + bottom + left + right ) / 4;
                        const value = center + (center - average) * strength;
                        data[i + c] = Math.max( 0, Math.min( 255, value ) );
                    }
                }
            }
            ctx.putImageData( image, 0, 0 );
            return canvas;
        }

        async function imageFileTo385x512(file) {
            const img = await loadImage385(file);

            const source = document.createElement("canvas");
            source.width = img.naturalWidth;
            source.height = img.naturalHeight;

            const ctx = source.getContext("2d", { alpha: false });
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = "high";
            ctx.drawImage( img, 0, 0 );

            return await processTo385x512( source );
        }

        function loadImage385(file) {
            return new Promise( (resolve, reject) => {
                const img = new Image();
                const url = URL.createObjectURL(file);
                img.onload = () => {
                    URL.revokeObjectURL(url);
                    resolve(img);
                };
                img.onerror = () => {
                    URL.revokeObjectURL(url);
                    reject( new Error( "ছবি পড়া যায়নি।" ) );
                };
                img.src = url;
            } );
        }

        function canvasToJPEG385( canvas, quality = 0.94 ) {
            return new Promise( (resolve, reject) => {
                canvas.toBlob( blob => {
                    if (!blob) {
                        reject( new Error( "JPEG তৈরি করা যায়নি।" ) );
                        return;
                    }
                    resolve(blob);
                }, "image/jpeg", quality );
            } );
        }

        /* =========================================================
           UI LOGIC
           ========================================================= */
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const dropContent = document.getElementById('drop-content');
        const previewContainer = document.getElementById('preview-container');
        const imagePreview = document.getElementById('image-preview');
        const fileNameEl = document.getElementById('file-name');
        const enhanceBtn = document.getElementById('enhance-btn');
        const statusBox = document.getElementById('status-box');
        const statusText = document.getElementById('status-text');
        const resultSection = document.getElementById('result-section');
        const resultImage = document.getElementById('result-image');
        const downloadBtn = document.getElementById('download-btn');

        let selectedFile = null;
        let session = null;

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('border-pink-400');
        });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('border-pink-400'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-pink-400');
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            selectedFile = file;
            fileNameEl.textContent = file.name;
            const reader = new FileReader();
            reader.onload = (e) => {
                imagePreview.src = e.target.result;
                dropContent.classList.add('hidden');
                previewContainer.classList.remove('hidden');
                enhanceBtn.disabled = false;
                enhanceBtn.classList.remove('opacity-40', 'cursor-not-allowed');
            };
            reader.readAsDataURL(file);
        }

        enhanceBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            enhanceBtn.disabled = true;
            statusBox.classList.remove('hidden');
            resultSection.classList.add('hidden');

            try {
                /* ---------- ১) আপনার 385×512 প্রসেসর দিয়ে ক্যানভাস তৈরি ---------- */
                statusText.textContent = "ছবি 385×512 হাই-কোয়ালিটি ফরম্যাটে প্রসেস হচ্ছে...";

                const processedCanvas = await imageFileTo385x512(selectedFile);

                /* ---------- ২) ONNX মডেল লোড (প্রয়োজন হলে) ---------- */
                if (!session) {
                    statusText.textContent = "Real-ESRGAN মডেল লোড হচ্ছে (প্রথমবার একটু সময় নিতে পারে)...";
                    ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/';

                    const modelUrl = 'https://huggingface.co/Heliosoph/realesrgan-onnx/resolve/main/realesr-general-x4v3.onnx';
                    session = await ort.InferenceSession.create(modelUrl, {
                        executionProviders: ['webgl', 'wasm']
                    });
                }

                statusText.textContent = "ছবি এনালাইজ ও 4x শার্পনেস রিকনস্ট্রাক্ট করা হচ্ছে...";

                /* ---------- ৩) প্রসেসড ক্যানভাস থেকে টেনসর তৈরি ---------- */
                const w = processedCanvas.width;
                const h = processedCanvas.height;
                const ctx = processedCanvas.getContext('2d', { willReadFrequently: true });
                const imgData = ctx.getImageData(0, 0, w, h);

                const floatData = new Float32Array(3 * w * h);
                for (let i = 0; i < w * h; i++) {
                    const r = imgData.data[i * 4] / 255.0;
                    const g = imgData.data[i * 4 + 1] / 255.0;
                    const b = imgData.data[i * 4 + 2] / 255.0;
                    floatData[i] = r;
                    floatData[w * h + i] = g;
                    floatData[2 * w * h + i] = b;
                }

                const inputTensor = new ort.Tensor('float32', floatData, [1, 3, h, w]);
                const feeds = {};
                feeds[session.inputNames[0]] = inputTensor;

                const results = await session.run(feeds);
                const outputTensor = results[session.outputNames[0]];

                const outH = h * 4;
                const outW = w * 4;
                const outData = outputTensor.data;

                /* ---------- ৪) আউটপুট ক্যানভাসে রূপান্তর ---------- */
                const outCanvas = document.createElement('canvas');
                outCanvas.width = outW;
                outCanvas.height = outH;
                const outCtx = outCanvas.getContext('2d');
                const outImageData = outCtx.createImageData(outW, outH);

                for (let i = 0; i < outW * outH; i++) {
                    const r = Math.min(255, Math.max(0, Math.round(outData[i] * 255)));
                    const g = Math.min(255, Math.max(0, Math.round(outData[outW * outH + i] * 255)));
                    const b = Math.min(255, Math.max(0, Math.round(outData[2 * outW * outH + i] * 255)));

                    outImageData.data[i * 4] = r;
                    outImageData.data[i * 4 + 1] = g;
                    outImageData.data[i * 4 + 2] = b;
                    outImageData.data[i * 4 + 3] = 255;
                }

                outCtx.putImageData(outImageData, 0, 0);

                outCanvas.toBlob((blob) => {
                    const resultUrl = URL.createObjectURL(blob);
                    resultImage.src = resultUrl;
                    downloadBtn.href = resultUrl;
                    resultSection.classList.remove('hidden');
                    statusBox.classList.add('hidden');
                    enhanceBtn.disabled = false;
                }, 'image/png');

            } catch (err) {
                console.error(err);
                statusText.textContent = "ত্রুটি: " + err.message;
                enhanceBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
